# Unprivileged trigger stage for the review-checklists workflow.
#
# This workflow reacts to every event that can affect checklist state,
# including events raised for pull requests from forked repositories
# (pull_request_review, pull_request_review_comment).  For those events
# GitHub always issues a read-only GITHUB_TOKEN, no matter what the
# `permissions:` block requests, so this workflow must not (and does not)
# attempt to write anything.
#
# It performs no checkout and executes no repository/PR-supplied code, and
# transfers nothing to the privileged `review_checklists_apply.yml`
# workflow: everything the apply stage needs (event name, head SHA, PR
# number, and even whether anything actually needs invalidating) is derived
# natively from the `workflow_run` context / the GitHub API / a live diff
# against run history, so no event-payload data has to be trusted or
# carried across the trust boundary at all.  This job's sole purpose is to
# exist and complete, so that `workflow_run` fires the apply stage, which
# always executes with the base repository's permissions regardless of
# where the triggering event originated.
#
# See "Preventing pwn requests" for background on this pattern:
# https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/

name: Review Checklists (Trigger)

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  trigger-apply:
    name: Trigger apply stage
    runs-on: ubuntu-24.04
    steps:
      # No-op: this job exists only so that its completion fires the
      # `workflow_run`-triggered apply stage. Nothing needs to be computed
      # or transferred here.
      - name: Signal apply stage
        run: echo "Triggering privileged apply stage via workflow_run."
