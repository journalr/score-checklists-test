# Privileged apply stage for the review-checklists workflow.
#
# Triggered via `workflow_run` once "Review Checklists (Trigger)" completes.
# `workflow_run` always executes using the base repository's workflow file
# and permissions, regardless of which repository (including forks) raised
# the original event — this is what lets this job safely hold a
# pull-requests/statuses write token even though some of the original
# events (pull_request_review, pull_request_review_comment on fork PRs)
# would otherwise force a read-only GITHUB_TOKEN.
#
# This workflow does all the actual work: it downloads the original event
# payload captured by the trigger stage, figures out which action(s) apply,
# and re-runs the exact same logic the previous single-stage workflow used
# to run directly on the untrusted events.
#
# Keep review-checklists up to date on pull requests and report whether all
# checklists have been acknowledged by every approving reviewer.
#
# Original events handled (as captured by the trigger stage):
#   pull_request_target (opened/reopened/synchronize/edited)
#     -> Post or update checklist findings on the PR.
#     -> On synchronize: invalidate stale OKs for affected checklists.
#     -> On edited: refresh checklist evidence/notices after PR description changes.
#     -> Re-check acknowledgements.
#   pull_request_review_comment (created/edited/deleted)
#     -> Restore checklist findings if they were tampered with or deleted.
#     -> On edit/delete: handle OK retraction.
#     -> Re-check acknowledgements.
#   pull_request_review (submitted/dismissed)
#     -> Re-check acknowledgements (approver set may have changed).
#   merge_group (checks_requested)
#     -> Re-check acknowledgements (assumed OK; see check_acknowledgements.py).
#
# When a PR is in merge queue, the workflow also ensures:
#   - a persistent PR comment notice, and
#   - a standalone PR-description notice,
# explaining that post-queue changes do not alter evidence recorded in git
# history by the merge commit evidence flow.

name: Review Checklists (Apply)

on:
  workflow_run:
    workflows: ["Review Checklists (Trigger)"]
    types: [completed]

permissions:
  pull-requests: write
  statuses: write
  actions: read

concurrency:
  group: >-
    review-checklists-apply-${{ github.event.workflow_run.head_sha || github.event.workflow_run.id }}

jobs:
  review-checklists:
    name: Review Checklists
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # The event artifact is attacker-influenced (it originates from the
      # forked PR's webhook payload), so it is downloaded outside of the
      # checked-out workspace and only ever read as data (via jq/JSON
      # parsing), never interpolated into a shell command or executed.
      - name: Download event artifact
        uses: actions/download-artifact@v4
        with:
          name: event
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/event

      - name: Parse original event
        id: parse
        env:
          EVENT_DIR: ${{ runner.temp }}/event
        run: |
          event_name="$(cat "$EVENT_DIR/event_name.txt")"
          action="$(jq -r '.action // empty' "$EVENT_DIR/event.json")"
          pr_number="$(jq -r '.pull_request.number // empty' "$EVENT_DIR/event.json")"
          before_sha="$(jq -r '.before // empty' "$EVENT_DIR/event.json")"
          after_sha="$(jq -r '.after // empty' "$EVENT_DIR/event.json")"
          head_sha="$(jq -r '.merge_group.head_sha // empty' "$EVENT_DIR/event.json")"

          {
            echo "event_name=${event_name}"
            echo "action=${action}"
            echo "pr_number=${pr_number}"
            echo "before_sha=${before_sha}"
            echo "after_sha=${after_sha}"
            echo "head_sha=${head_sha}"
            echo "event_path=${EVENT_DIR}/event.json"
          } >> "$GITHUB_OUTPUT"

      # Step 1: Post or update checklist findings.
      # Runs on PR open/reopen/sync, on PR description edits, and on
      # review comment events so tampered checklist findings and notices
      # are restored.
      - name: Post / update checklist findings
        if: >-
          steps.parse.outputs.event_name == 'pull_request_target' ||
          steps.parse.outputs.event_name == 'pull_request_review_comment'
        uses: ./actions/review_checklists
        with:
          action: post
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.parse.outputs.pr_number }}
          event-name: ${{ steps.parse.outputs.event_name }}
          event-path: ${{ steps.parse.outputs.event_path }}

      # Step 2: Invalidate stale OKs when new commits are pushed.
      - name: Invalidate stale acknowledgements
        if: >-
          steps.parse.outputs.event_name == 'pull_request_target' &&
          steps.parse.outputs.action == 'synchronize'
        uses: ./actions/review_checklists
        with:
          action: dismiss_sync
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.parse.outputs.pr_number }}
          before-sha: ${{ steps.parse.outputs.before_sha }}
          after-sha: ${{ steps.parse.outputs.after_sha }}
          event-name: ${{ steps.parse.outputs.event_name }}
          event-path: ${{ steps.parse.outputs.event_path }}

      # Step 3: Dismiss approval if a reviewer retracted their OK.
      - name: Handle OK retraction
        if: >-
          steps.parse.outputs.event_name == 'pull_request_review_comment' &&
          (steps.parse.outputs.action == 'edited' || steps.parse.outputs.action == 'deleted')
        uses: ./actions/review_checklists
        with:
          action: dismiss_edit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.parse.outputs.pr_number }}
          event-name: ${{ steps.parse.outputs.event_name }}
          event-path: ${{ steps.parse.outputs.event_path }}

      # Step 4: Always re-check acknowledgement status.
      # The script sets the commit status context "review-checklists"
      # to "pending" or "success".  Commit statuses with the same
      # context on the same SHA are deduplicated, so the latest result
      # from any trigger always wins.  This job always has write access
      # (it only ever runs via workflow_run) — branch protection must
      # require the commit status context (not the workflow check run)
      # to gate merges.
      - name: Check acknowledgements
        uses: ./actions/review_checklists
        with:
          action: check
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.parse.outputs.pr_number }}
          head-sha: ${{ steps.parse.outputs.head_sha }}
          event-name: ${{ steps.parse.outputs.event_name }}
          event-path: ${{ steps.parse.outputs.event_path }}
